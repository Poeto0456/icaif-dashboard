<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#080d17">
<title>ICAIF 2026 — GraphNSPDE Trading Agent</title>
<script>
/* Theme before first paint: saved choice, else the system setting. No flash of the wrong theme. */
(function(){var t=null;try{t=localStorage.getItem('icaif-theme');}catch(e){}
if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --bg:#080d17;--side:#0d1421;--surface:#111a2b;--raised:#16213a;--tile:#1a2540;--line:#1e2a40;--line-strong:#2b3a55;
  --text:#e8eef9;--muted:#8ea3c3;--faint:#5f7190;--accent:#6495ed;--accent-soft:rgba(100,149,237,.15);
  --pos:#34c69a;--neg:#ef6475;--warn:#f2b84b;--pos-soft:rgba(52,198,154,.14);--neg-soft:rgba(239,100,117,.14);--warn-soft:rgba(242,184,75,.14);
  --s2:#b08cf0;--s3:#f2b84b;--shadow:0 1px 0 rgba(255,255,255,.02) inset,0 6px 20px rgba(0,0,0,.25);--radius:12px;
  --font:Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f3f5f9;--side:#ffffff;--surface:#ffffff;--raised:#f5f7fb;--tile:#eef1f6;--line:#e3e8f0;--line-strong:#cbd4e1;
  --text:#101a2e;--muted:#56657e;--faint:#8291a8;--accent:#2f62c9;--accent-soft:rgba(47,98,201,.10);
  --pos:#0c8f63;--neg:#cf3550;--warn:#a86a10;--pos-soft:rgba(12,143,99,.11);--neg-soft:rgba(207,53,80,.10);--warn-soft:rgba(168,106,16,.12);
  --s2:#7a4fd0;--s3:#a86a10;--shadow:0 1px 2px rgba(16,26,46,.05),0 4px 14px rgba(16,26,46,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;gap:16px;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 8px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--accent);flex:none}
.brand b{display:block;font-size:13.5px;letter-spacing:.01em}.brand span{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13.5px;transition:background .12s,color .12s}
.nav button:hover{background:var(--raised);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.nav button.on svg{color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 8px;font-size:11.5px;color:var(--muted)}
.scrim{display:none}
.main{min-width:0;padding:18px clamp(14px,2.2vw,28px) 48px;max-width:1680px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top .left{display:flex;align-items:center;gap:10px;min-width:0}
.top h1{font-size:15px;font-weight:650;margin:0;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill.live .dot{background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}.pill.stale{color:var(--warn);border-color:var(--warn)}.pill.stale .dot{background:var(--warn)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;color:var(--text);transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--raised);border-color:var(--faint)}.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.nav button:focus-visible,.seg button:focus-visible,th:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:14px;height:14px}
#menu{display:none}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--text);border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:12px}
.banner.err{border-color:var(--neg);background:var(--neg-soft)}.banner.info{border-color:var(--line-strong);background:var(--raised);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.card .sub{font-size:12px;color:var(--muted);margin-top:10px}
.grid{display:grid;gap:14px}.stack{display:flex;flex-direction:column;gap:14px}
.cols{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}.half{grid-template-columns:repeat(2,minmax(0,1fr))}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:650;letter-spacing:.05em;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.chip.a{color:var(--accent);background:var(--accent-soft);border-color:transparent}.chip.g{color:var(--pos);background:var(--pos-soft);border-color:transparent}
.chip.w{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.nav-value{font-size:clamp(30px,6.4vw,44px);font-weight:680;letter-spacing:-.02em;line-height:1.06;margin:4px 0 6px}
.delta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15.5px;font-weight:650}
.delta small{font-size:12.5px;font-weight:400;color:var(--muted)}
.kpis{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
.kpi span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:18px;font-weight:660;margin-top:5px;white-space:nowrap}
.kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
.metric{padding:14px}
.metric .name{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.metric .val{font-size:clamp(20px,4.6vw,25px);font-weight:670;letter-spacing:-.01em;margin:6px 0 7px}
.metric .prev{font-size:11.5px;color:var(--muted);margin-top:7px}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.06em;vertical-align:1px}
.tag.OFFICIAL{color:var(--accent);background:var(--accent-soft)}.tag.RECONSTRUCTED,.tag.DERIVED{color:var(--pos);background:var(--pos-soft)}
.tag.ESTIMATED,.tag.MARKET{color:var(--warn);background:var(--warn-soft)}.tag.UNAVAILABLE{color:var(--muted);background:var(--raised);border:1px solid var(--line)}
.info{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-size:11px;color:var(--muted);flex:none}
.note{display:none;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.metric.open .note{display:block}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line-strong);border-radius:8px;overflow-x:auto;scrollbar-width:none;background:var(--raised)}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.seg button[disabled]{opacity:.4;cursor:default}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);font-size:12px;color:var(--text)}
.key i{width:10px;height:3px;border-radius:2px;display:inline-block}.key.off{opacity:.42}
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;z-index:15;min-width:160px;max-width:250px;background:var(--raised);border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-size:12px;box-shadow:0 10px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:12.5px;margin-bottom:3px}.tip div{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}.tip div span:last-child{color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile-k span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile-k b{display:block;font-size:19px;font-weight:660;margin-top:4px}
.tile-k small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.search,.select{background:var(--raised);border:1px solid var(--line-strong);border-radius:8px;padding:5px 10px;font-size:12.5px;outline:none;color:var(--text)}
.search{width:140px}.search:focus,.select:focus{border-color:var(--accent)}
.check{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.scroll.tall{max-height:560px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface);z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{z-index:3}th.nosort{cursor:default}th.l,td.l{text-align:left}
table.wide th,table.wide td{padding:7px 6px;font-size:12.5px}table.wide th{font-size:10px}
tbody tr:hover td{background:var(--raised)}
tr.idle td{color:var(--faint)}tr.grp td{background:var(--raised);font-weight:600;font-size:12px}
td .sym{font-weight:660}td small{display:block;color:var(--muted);font-size:11px}
.badge{display:inline-block;padding:0 5px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.05em;margin-left:6px;color:var(--muted);border:1px solid var(--line-strong)}
.badge.BUY{color:var(--pos);border-color:transparent;background:var(--pos-soft)}.badge.SELL{color:var(--neg);border-color:transparent;background:var(--neg-soft)}
.bar{height:6px;border-radius:4px;background:var(--raised);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hlist{display:none}
.hlist details{border-bottom:1px solid var(--line)}
.hlist summary{list-style:none;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;cursor:pointer}
.hlist summary::-webkit-details-marker{display:none}
.hlist .more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;padding:2px 0 13px;font-size:12.5px}
.hlist .more span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.movers{display:flex;flex-direction:column}
.mv{display:grid;grid-template-columns:54px minmax(0,1fr) 78px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mv:last-child{border-bottom:0}.mv b{font-weight:660}.mv small{color:var(--muted);font-size:11px;display:block}
.mv .track{height:6px;border-radius:4px;background:var(--raised);overflow:hidden}.mv .track i{display:block;height:100%;border-radius:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.scard{all:unset;cursor:pointer;display:block;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:9px 10px 6px;transition:border-color .12s,background .12s;min-width:0}
.scard:hover{border-color:var(--faint)}.scard.sel{border-color:var(--accent);background:var(--accent-soft)}.scard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scard .r1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13.5px}.scard .r1 b{font-weight:680}
.scard .r2{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);margin:1px 0 4px;white-space:nowrap}
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;padding:0 0 14px;position:relative}
.ev:before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:1px;background:var(--line-strong)}.ev:last-child:before{display:none}
.ev .pt{width:11px;height:11px;border-radius:50%;margin:5px 0 0 3px;border:2px solid var(--faint);background:var(--surface);z-index:1}
.ev.REBALANCE .pt{border-color:var(--accent);background:var(--accent)}.ev.ERR .pt{border-color:var(--neg);background:var(--neg)}.ev.PENDING .pt{border-color:var(--warn)}
.ev b{font-size:13.5px}.ev p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.defs p{font-size:13px;margin:0 0 10px}.defs b{display:block;font-size:12.5px}
details.fold{border:1px solid var(--line);border-radius:10px;background:var(--raised)}
details.fold summary{cursor:pointer;padding:11px 14px;font-size:13px;font-weight:600;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary:after{content:"+";float:right;color:var(--muted)}details.fold[open] summary:after{content:"−"}
details.fold .body{padding:0 14px 12px}
.cmp th,.cmp td{padding:8px 10px}.cmp td.na{color:var(--faint);font-size:12px;white-space:normal;min-width:120px}
.page{display:none;animation:fade .16s ease}.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line-strong);padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
@media (max-width:1500px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1100px){.cols,.half{grid-template-columns:minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:240px;transform:translateX(-102%);transition:transform .18s ease;box-shadow:0 0 40px rgba(0,0,0,.45)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  #menu{display:inline-flex}
  .main{padding:12px 12px calc(32px + env(safe-area-inset-bottom))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .card{padding:13px}.scroll{margin:0 -13px;padding:0 13px}
  .top h1 small{display:none}
}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.htable{display:none}.hlist{display:block}.btn .lbl{display:none}.nav button{min-height:44px}.search{width:118px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.tools,#menu{display:none}.app{display:block}.page{display:block!important}}
</style>
</head>

    </div>
    <div id="banners"></div>
    <section class="page on" id="p-overview"></section>
    <section class="page" id="p-holdings"></section>
    <section class="page" id="p-stocks"></section>
    <section class="page" id="p-benchmarks"></section>
    <section class="page" id="p-attribution"></section>
    <section class="page" id="p-trades"></section>

    <section class="page" id="p-data"></section>
  </main>

  t.sort(function(x,y){var a=x[k],b=y[k];return (typeof a==='string'?String(a).localeCompare(String(b)):(a||0)-(b||0))*d||y.notional-x.notional;});
  var cols=[['symbol','Symbol'],['time','Executed'],['round_id','Round'],['submission_id','Submission'],['side','Side'],['shares','Shares'],['price','Price'],['notional','Notional'],['fee','Fee'],['realized','Realized P&L'],['status','Status']];
  el.innerHTML='<div class="stack"><div class="grid tiles"><div class="card tile-k"><span>Executed trades</span><b class="num">'+t.length+'</b><small>organizer-confirmed fills only</small></div><div class="card tile-k"><span>Bought</span><b class="num">'+usd(buy,0)+'</b><small>notional</small></div><div class="card tile-k"><span>Sold</span><b class="num">'+usd(sell,0)+'</b><small>notional</small></div><div class="card tile-k"><span>Fees</span><b class="num">'+usd(fee)+'</b><small>already inside NAV</small></div></div>'+
   '<div class="card"><div class="head"><h2>Rebalance events</h2>'+tag('OFFICIAL')+'</div>'+(ev.length?'<div class="scroll"><table><thead><tr><th class="nosort">Round</th><th class="nosort">Executed</th><th class="nosort">Submission</th><th class="nosort">Trades</th><th class="nosort">Bought</th><th class="nosort">Sold</th><th class="nosort">Fee</th><th class="nosort">Turnover of the round</th></tr></thead><tbody>'+
     ev.map(function(e){var b=before[e.round_id];return '<tr><td class="mono">'+esc(rshort(e.round_id))+'</td><td>'+esc(when(e.time,true))+'</td><td class="num">'+(e.sub?'#'+esc(e.sub):'—')+'</td><td class="num">'+e.n+'</td><td class="num">'+usd(e.buy,0)+'</td><td class="num">'+usd(e.sell,0)+'</td><td class="num">'+usd(e.fee)+'</td><td class="num">'+(b?num((e.buy+e.sell)/b,4):'—')+'</td></tr>';}).join('')+'</tbody></table></div>':empty('No rebalance yet',''))+
     '<div class="sub">Turnover of a round is its buy-plus-sell notional divided by NAV before execution; the competition metric is the mean of this over every period, HOLD periods included.</div></div>'+
   '<div class="card"><div class="head"><h2>Trade history</h2><span class="muted" style="font-size:12px">select a column to sort</span></div>'+(t.length?'<div class="scroll tall"><table style="min-width:940px"><thead><tr>'+cols.map(function(c){return '<th tabindex="0" data-t="'+c[0]+'">'+c[1]+(k===c[0]?(d>0?' ↑':' ↓'):'')+'</th>';}).join('')+'</tr></thead><tbody>'+
   t.map(function(x){return '<tr><td><span class="sym">'+esc(x.symbol)+'</span></td><td>'+esc(when(x.time,true))+'</td><td class="mono">'+esc(rshort(x.round_id))+'</td><td class="num">'+(x.submission_id?'#'+esc(x.submission_id):'—')+'</td><td><span class="badge '+esc(x.side)+'" style="margin:0">'+esc(x.side)+'</span></td><td class="num">'+num(x.shares,x.shares<1?6:3)+'</td><td class="num">'+usd(x.price)+'</td><td class="num">'+usd(x.notional)+'</td><td class="num">'+usd(x.fee,x.fee<0.01?5:2)+'</td><td class="num '+cls(x.realized)+'">'+(x.realized?sgnUsd(x.realized):'—')+'</td><td>'+esc(x.status||'—')+'</td></tr>';}).join('')+'</tbody></table></div>':empty('No executed trade yet','Fills appear here once the organizer confirms an execution.'))+
   '<div class="sub">A HOLD round has no trade and appears only in the activity timeline. Fees are 0.1% of notional and are already reflected in NAV.</div></div></div>';
}
function activity(){
  var el=document.getElementById('p-activity'),a=DATA.activity,st=DATA.meta.strategy,m=DATA.meta,dp=m.data_prep;
  el.innerHTML='<div class="grid cols"><div class="card"><div class="head"><h2>Round timeline</h2><span class="muted" style="font-size:12px">newest first</span></div>'+(a.length?'<div class="timeline">'+a.map(evHtml).join('')+'</div>':empty('No round has opened yet',''))+'</div>'+
   '<div class="stack"><div class="card"><div class="head"><h2>Data freshness</h2></div><dl class="kv"><dt>Portfolio valued</dt><dd>'+esc(when(DATA.account.as_of,true))+'</dd><dt>Last organizer read</dt><dd>'+esc(when(m.last_success_at,true))+' · '+esc(m.fetch_status||'—')+'</dd><dt>Organizer clock at that read</dt><dd>'+esc(when(DATA.status.organizer_time,true))+'</dd>'+
     (dp?'<dt>Round-1 market data</dt><dd>'+esc(dp.status)+' for '+esc(dp.decision_day||'—')+(dp.coverage?' · '+esc(dp.coverage):'')+'</dd><dt>Checked</dt><dd>'+esc(when(dp.finished_at,true))+'</dd>':'')+'</dl><div class="sub">This page is read-only. It has no control that arms, submits or changes the Official runner.</div></div>'+
   (st?'<div class="card"><div class="head"><h2>Strategy</h2></div><dl class="kv"><dt>Policy</dt><dd>'+esc(st.policy)+'</dd><dt>Model run</dt><dd class="mono">'+esc(st.model_run||'—')+'</dd>'+(st.manifest?'<dt>Bundle</dt><dd class="mono">'+esc(st.manifest)+'…</dd>':'')+'<dt>Last decision day</dt><dd>'+esc(st.last_decision_day||'—')+'</dd><dt>Decisions made</dt><dd>'+esc(st.decisions==null?'—':st.decisions)+'</dd></dl><div class="sub">Read from the runner’s records.</div></div>':'')+
   '<div class="card"><div class="head"><h2>Reading this timeline</h2></div><div class="defs"><p><b>REBALANCE</b>A decision was uploaded, validated, selected and executed by the organizer.</p><p><b>HOLD</b>No decision was uploaded. The organizer completed the round with zero traded notional; this is the strategy’s normal state, not a failure.</p><p><b>HOLD (local)</b>The runner has recorded a hold, and the organizer has not completed that round yet.</p><p style="margin:0"><b>PENDING</b>Open or awaiting organizer confirmation. No execution is implied.</p></div></div></div></div>';
}
function dataPage(){
  var m=DATA.metrics,meta=DATA.meta,a=DATA.account,an=AN(),el=document.getElementById('p-data'),fr=meta.fetch_results||{};
  var rows=m.period_rows.slice().reverse().map(function(p){return '<tr><td class="mono">'+esc(rshort(p.round_id))+'</td><td>'+esc(p.action)+'</td><td class="num">'+usd(p.nav_before)+'</td><td class="num">'+usd(p.nav_end)+'</td><td class="num '+cls(p.ret)+'">'+pct(p.ret,4,true)+'</td><td class="num">'+num(p.notional/p.nav_before,4)+'</td><td class="num">'+usd(p.fee)+'</td></tr>';}).join('');
  el.innerHTML='<div class="stack"><div class="grid cols"><div class="card"><div class="head"><h2>Competition metrics — definitions</h2></div><div class="defs">'+['cumulative_return','sharpe_ratio','maximum_drawdown','turnover'].map(function(k){var c=m.cards[k];return '<p><b>'+esc(k.replace(/_/g,' ').replace(/\b\w/g,function(x){return x.toUpperCase();}))+' '+tag(c.label)+'</b>'+esc(m.definitions[k])+' <span class="muted">'+esc(c.note)+'</span></p>';}).join('')+
   '<p class="muted" style="margin:0">OFFICIAL: supplied by the organizer. RECONSTRUCTED: the exact formula on complete organizer ledger values. DERIVED: computed here from organizer data. MARKET: from the market-data provider. ESTIMATED: an observation the formula needs is missing. UNAVAILABLE: not defined yet.</p></div></div>'+
   '<div class="card"><div class="head"><h2>Completeness</h2></div><dl class="kv"><dt>Completed periods</dt><dd class="num">'+m.periods_completed+' of '+m.periods_scheduled+'</dd><dt>Rounds completed</dt><dd class="num">'+m.rounds_completed+'</dd><dt>Cancelled rounds</dt><dd class="num">'+m.cancelled_rounds+'</dd><dt>Open period</dt><dd>'+esc(m.open_round?rshort(m.open_round)+' — endpoint not yet observed':'—')+'</dd><dt>Metrics through</dt><dd>'+esc(when(m.as_of,true))+'</dd><dt>Ledger gaps</dt><dd>'+esc(m.missing.length?m.missing.join('; '):'none')+'</dd><dt>Daily closes missing</dt><dd>'+esc(m.daily_closes_missing.length?m.daily_closes_missing.join(', '):'none')+'</dd><dt>Official metrics</dt><dd>'+esc(meta.official_metrics||'—')+'</dd>'+
     (an?'<dt>Rounds with organizer prices</dt><dd class="num">'+an.status.rounds_with_prices+' of '+an.status.completed_rounds+'</dd><dt>Session closes observed</dt><dd>'+esc(an.status.closes_observed.join(', ')||'none')+'</dd>':'')+'</dl></div></div>'+
   '<div class="grid half"><div class="card"><div class="head"><h2>Turnover metric over time</h2>'+tag('RECONSTRUCTED')+'</div><div class="chart" id="toChart"></div><div class="sub">Mean of notional ÷ NAV over the periods completed so far. It falls with every HOLD period.</div></div>'+
   '<div class="card"><div class="head"><h2>Rolling volatility and Sharpe</h2>'+tag(an&&an.rolling?'DERIVED':'UNAVAILABLE')+'</div><div class="chart" id="rollChart"></div><div class="sub">21-period window of decision-period returns, annualised with 42.</div></div></div>'+
   '<div class="card"><div class="head"><h2>Decision periods</h2><span class="muted" style="font-size:12px">B = NAV before execution · E = NAV at the next execution, before its fee</span></div>'+(rows?'<div class="scroll tall"><table><thead><tr><th class="nosort">Round</th><th class="nosort">Action</th><th class="nosort">B</th><th class="nosort">E</th><th class="nosort">Return</th><th class="nosort">N ÷ B</th><th class="nosort">Fee</th></tr></thead><tbody>'+rows+'</tbody></table></div>':empty('No completed period yet','The first period closes when the second round executes.'))+'</div>'+
   '<div class="grid cols"><div class="card"><div class="head"><h2>Data sources</h2></div><dl class="kv"><dt>Portfolio valued</dt><dd>'+esc(when(a.as_of))+'</dd><dt>Last successful read</dt><dd>'+esc(when(meta.last_success_at))+'</dd><dt>'+(PUBLISHED?'Page published':'Page generated')+'</dt><dd>'+esc(when(meta.published_at||meta.generated_at))+'</dd>'+['schedule','portfolio','ledger','decisions','metrics'].map(function(k){return '<dt>GET '+k+'</dt><dd>'+esc(fr[k]||'—')+'</dd>';}).join('')+'<dt>Holdings + cash − NAV</dt><dd class="num">'+usd(a.reconciliation,6)+'</dd>'+
     (an?'<dt>Analytics prices</dt><dd>'+esc(an.status.price_source)+'</dd>':'')+'</dl><div class="sub">'+esc(a.accounting_note||'')+'</div></div>'+
   '<div class="card"><div class="head"><h2>About this page</h2></div><div class="defs"><p>Read-only monitor. It reads the organizer through GET requests only and cannot upload a decision.</p><p>It contains no credential. Times are shown in this device’s time zone; sessions are New York trading days.</p><p style="margin:0">Benchmarks and attribution are computed here from organizer prices. They are analysis, not organizer results.</p></div></div></div></div>';
}
function drawData(){
  var an=AN(),to=an?an.turnover_trend:DATA.metrics.period_rows.map(function(p,i,all){var s=0;for(var j=0;j<=i;j++)s+=all[j].notional/all[j].nav_before;return {t:p.end,turnover:s/(i+1)};});
  chart(document.getElementById('toChart'),{label:'Turnover metric over time',h:220,area:false,x:to.map(function(r){return r.t;}),yfmt:function(v){return num(v,3);},series:[{color:'var(--accent)',values:to.map(function(r){return r.turnover;})}],tip:function(i){return tipRows(when(to[i].t,true),[['Turnover after '+(i+1)+' period'+(i?'s':''),num(to[i].turnover,4)]]);},emptyText:'Defined after the first completed decision period.'});
  var host=document.getElementById('rollChart');
  if(an&&an.rolling){var r=an.rolling;chart(host,{label:'Rolling volatility and Sharpe',h:220,area:false,x:r.map(function(q){return q.t;}),yfmt:function(v){return pct(v,1);},series:[{color:'var(--accent)',values:r.map(function(q){return q.volatility;})}],tip:function(i){return tipRows(when(r[i].t,true),[['Volatility, annualised',pct(r[i].volatility,2)],['Sharpe',num(r[i].sharpe,2)]]);}});}
  else host.innerHTML=empty('Not enough history',an?an.rolling_note:anReason());
}

/* ---------- render ---------- */
function draw(){
  if(DATA.meta.empty)return;var p=S.page,an=AN();
  if(p==='overview'){drawEquity();
    chart(document.getElementById('ddChart'),{label:'Drawdown',h:230,zeroTop:true,x:DATA.metrics.series.map(function(q){return q.t;}),yfmt:function(v){return pct(v,2);},series:[{color:'var(--neg)',values:DATA.metrics.series.map(function(q){return -q.drawdown;})}],
      tip:function(i){var q=DATA.metrics.series[i];return tipRows(when(q.t,true),[[esc(kindName(q.kind)),''],['Drawdown',pct(-q.drawdown,3)],['NAV',usd(q.nav,0)]]);},emptyText:'Defined after the first completed decision period.'});
    bars(document.getElementById('topBars'),DATA.holdings.filter(function(h){return h.held&&!h.dust;}).slice(0,8),null);drawDonut(document.getElementById('ovDonutHost'));}
  if(p==='holdings')drawHoldings();
  if(p==='stocks')drawStocks();
  if(p==='benchmarks')drawBenchmarks();
  if(p==='attribution')drawAttribution();
  if(p==='data')drawData();
}
function render(){
  document.getElementById('title').innerHTML=esc(DATA.meta.title||document.title)+'<small>Quant Terminal</small>';
  freshness();var st=DATA.meta.strategy;
  document.getElementById('sideStatus').textContent=DATA.meta.empty?'':'Data '+(ago(DATA.meta.last_success_at)||'—');
  document.getElementById('sideModel').textContent=st&&st.policy?st.policy:'';
  if(DATA.meta.empty){document.getElementById('p-overview').innerHTML='<div class="card">'+empty('No data yet',DATA.meta.note||'')+'</div>';PAGES.slice(1).forEach(function(p){document.getElementById('p-'+p[0]).innerHTML='<div class="card">'+empty('Nothing to show yet','This page fills in after the first refresh.')+'</div>';});return;}
  overview();holdings();stocksPage();benchmarks();attribution();trades();activity();dataPage();draw();
}
function fail(error){try{document.getElementById('banners').innerHTML='<div class="banner err">This page could not be drawn completely ('+esc(error&&error.message||error)+'). The stored data is unaffected; reload, or use the Refresh button.</div>';}catch(e){}}
window.addEventListener('error',function(e){fail(e.error||e.message);});
var SEG={ovRange:function(v){S.range=v;drawEquity();return true;},ovMode:function(v){S.mode=v;drawEquity();return true;},ovDonut:function(v){S.donut=v;drawDonut(document.getElementById('ovDonutHost'));return true;},hdDonut:function(v){S.donut=v;drawDonut(document.getElementById('donut'));return true;},
  hmU:function(v){S.hmU=v;holdings();draw();},hmC:function(v){S.hmC=v;drawHoldings();return true;},hmS:function(v){S.hmS=v;drawHoldings();return true;},mvU:function(v){S.mvU=v;drawHoldings();return true;},mvR:function(v){S.mvR=v;drawHoldings();return true;},
  stBasis:function(v){S.stBasis=v;stocksPage();draw();},excSeg:function(v){S.exc=v;benchmarks();draw();},atMode:function(v){S.attrMode=v;drawAttribution();return true;},atSort:function(v){S.attrSort=v;drawAttribution();return true;}};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-page]');if(b){go(b.getAttribute('data-page'));return;}
  b=e.target.closest('[data-go]');if(b){go(b.getAttribute('data-go'));return;}
  if(e.target.closest('#menu')){document.body.classList.toggle('drawer');return;}
  if(e.target.closest('#scrim')){document.body.classList.remove('drawer');return;}
  b=e.target.closest('.info');if(b){b.closest('.metric').classList.toggle('open');return;}
  b=e.target.closest('.seg button');if(b&&!b.disabled){var box=b.parentNode,fn=SEG[box.id];if(fn){var keep=fn(b.getAttribute('data-v'));if(keep){Array.prototype.forEach.call(box.children,function(x){x.classList.toggle('on',x===b);});}}return;}
  b=e.target.closest('[data-ovk]');if(b){if(b.getAttribute('data-ovk')==='ew'){S.showEw=!S.showEw;b.classList.toggle('off',!S.showEw);b.setAttribute('aria-pressed',S.showEw);drawEquity();}return;}
  b=e.target.closest('[data-bk]');if(b){var k=b.getAttribute('data-bk'),on=Object.keys(S.bench).filter(function(x){return S.bench[x];}).length;if(S.bench[k]&&on===1)return;S.bench[k]=!S.bench[k];b.classList.toggle('off',!S.bench[k]);b.setAttribute('aria-pressed',S.bench[k]);drawBenchmarks();return;}
  b=e.target.closest('[data-st]');if(b){S.stSel=b.getAttribute('data-st');Array.prototype.forEach.call(document.querySelectorAll('.scard'),function(x){var on=x===b;x.classList.toggle('sel',on);x.setAttribute('aria-pressed',on);});drawStocks();var host=document.getElementById('stChart');if(host&&window.innerWidth<=900&&host.scrollIntoView)host.scrollIntoView({block:'center'});return;}
  b=e.target.closest('th[data-s]');if(b){var sk=b.getAttribute('data-s');S.stSort={key:sk,dir:S.stSort.key===sk?-S.stSort.dir:(sk==='symbol'?1:-1)};stocksPage();draw();return;}
  b=e.target.closest('th[data-k]');if(b){var hk=b.getAttribute('data-k');S.sort={key:hk,dir:S.sort.key===hk?-S.sort.dir:(hk==='symbol'?1:-1)};holdingRows();return;}
  b=e.target.closest('th[data-t]');if(b){var tk=b.getAttribute('data-t');S.tsort={key:tk,dir:S.tsort.key===tk?-S.tsort.dir:(tk==='symbol'?1:-1)};trades();return;}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('th[tabindex]')){e.preventDefault();e.target.click();}if(e.key==='Escape')document.body.classList.remove('drawer');});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value.trim();holdingRows();}
  if(e.target.id==='stQ'){S.stQ=e.target.value.trim();var at=e.target.selectionStart;stocksPage();draw();var box=document.getElementById('stQ');if(box){box.focus();try{box.setSelectionRange(at,at);}catch(x){}}}});
document.addEventListener('change',function(e){if(e.target.id==='stSector'){S.stSector=e.target.value;stocksPage();draw();}if(e.target.id==='hz'){S.hideZero=e.target.checked;holdingRows();}if(e.target.id==='fSector'){S.sector=e.target.value;holdingRows();}if(e.target.id==='fSign'){S.sign=e.target.value;holdingRows();}});
document.getElementById('theme').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark',true);draw();};
setTheme(document.documentElement.getAttribute('data-theme')||'dark',false);
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: light)'),follow=function(){var saved=null;try{saved=localStorage.getItem('icaif-theme');}catch(e){}if(saved!=='light'&&saved!=='dark'){setTheme(mq.matches?'light':'dark',false);draw();}};if(mq.addEventListener)mq.addEventListener('change',follow);}
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(draw,140);});
var start=(location.hash||'').slice(1);if(PAGES.some(function(p){return p[0]===start;}))S.page=start;
document.getElementById('nav').innerHTML=navHtml();
PAGES.forEach(function(p){document.getElementById('p-'+p[0]).classList.toggle('on',p[0]===S.page);});
try{render();}catch(error){fail(error);}
setInterval(freshness,30000);
if(LIVE&&DATA.meta.mode!=='demo'){
  var rb=document.getElementById('refresh');rb.hidden=false;
  var pull=function(){return fetch('api/data.json',{cache:'no-store',credentials:'same-origin'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){DATA=d;try{render();}catch(error){fail(error);}}).catch(function(){freshness();});};
  rb.onclick=function(){rb.disabled=true;rb.textContent='Refreshing…';fetch('api/refresh',{method:'POST',credentials:'same-origin'}).then(function(r){return r.json();}).then(function(r){toast({OK:'Organizer data refreshed.',PARTIAL:'Partly refreshed; some organizer reads failed.',UNAVAILABLE:'Organizer unavailable; showing stored data.',QUIET_WINDOW:'Paused during the round-1 decision window.',TOO_SOON:'Refreshed under a minute ago.',BUSY:'A refresh is already running.'}[r.status]||'Refresh finished.');return pull();}).catch(function(){toast('The local dashboard server did not answer.');}).then(function(){rb.disabled=false;rb.textContent='Refresh';});};
  setInterval(pull,60000);
}
})();
</script>
